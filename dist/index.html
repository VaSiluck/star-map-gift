op&h=627&w=1200",caption:"Мы вышли на рассвете и не знали, куда идти",story:"Чай в подстаканнике, твоя голова у меня на плече и полстраны за окном. Ты уснула первая, а я всю ночь караулил, чтобы тебя не разбудили.",gift:"Ты научила меня, что дорога важнее пункта назначения. Я перестал торопить жизнь.",thought:"Двенадцать часов в никуда оказались одним из лучших мест."},{id:"v2",title:"Море в несезон",date:"холодный октябрь",x:1662,y:402,magnitude:1,photo:"https://images.pexels.com/photos/13833169/pexels-photo-13833169.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",caption:"Пустой пляж, который на два дня стал только нашим",story:"Ветер, мокрые кроссовки, один шарф на двоих. Мы были единственными людьми на берегу и вели себя так, будто это наша частная планета.",gift:"Ты умеешь делать праздник из ничего. Пустой пляж и термос — и это лучше любого отпуска по расписанию.",thought:"Я до сих пор слышу тот шум, когда закрываю глаза."},{id:"v3",title:"Горы и термос",date:"подъём, который мы почти не осилили",x:1842,y:330,magnitude:2,photo:"https://images.pexels.com/photos/15473093/pexels-photo-15473093.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",caption:"Наверху было холодно и абсолютно тихо",story:"Ты шла впереди и на каждом повороте говорила «ещё чуть-чуть». Соврала раз восемь. Но наверху мы сидели молча минут двадцать, и это было честнее любых слов.",gift:"Ты вытаскиваешь меня туда, куда я бы сам не пошёл. Со мной случается больше жизни, чем я бы себе разрешил.",thought:"Твоё «ещё чуть-чуть» работает даже вне гор."},{id:"v4",title:"Аэропорт в пять утра",date:"рейс, на который мы почти опоздали",x:2004,y:442,magnitude:3,photo:"https://images.pexels.com/photos/7908554/pexels-photo-7908554.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",caption:"Свет над водой, который мы поймали случайно",story:"Мы бежали по терминалу, ты хохотала и роняла посадочный. Сели в кресла, выдохнули — и оба уснули ещё до взлёта.",gift:"С тобой даже паника выглядит как прикл ",x:744,y:1152,magnitude:2,photo:"https://images.pexels.com/photos/14724195/pexels-photo-14724195.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",caption:"Мелочь, которая держит весь дом",story:"Я работаю, ты в соседней комнате смотришь что-то своё и вдруг смеёшься. И день сразу становится нормальным, что бы в нём ни происходило.",gift:"Ты вернула мне лёгкость. Я снова умею смеяться без причины — просто за компанию.",thought:"Это мой любимый звук. Без преувеличения."}]},{id:"tempestas",name:"Шторм",latin:"Tempestas",subtitle:"Тёмные звёзды. Они светят слабее, но держат созвездие",color:"#ff8aa6",lines:[["t1","t2"],["t2","t3"]],stars:[{id:"t1",title:"Тот тяжёлый год",date:"зима, которая тянулась",x:1520,y:980,magnitude:3,photo:"https://images.pexels.com/photos/28571057/pexels-photo-28571057.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",caption:"Свет в окне, когда снаружи ничего хорошего",story:"Я был не лучшей версией себя: закрытый, злой, уставший. Ты не стала меня чинить — ты просто осталась и включала свет каждый вечер.",gift:"Ты показала, что меня можно любить не только в хорошие дни. Это отменило половину моих страхов.",thought:"Ты выдержала меня тогда. Я это помню каждый день."},{id:"t2",title:"Разговор, который был нужен",date:"вечер, когда мы всё сказали",x:1702,y:1082,magnitude:2,photo:"https://images.pexels.com/photos/35808078/pexels-photo-35808078.png?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",caption:"Два остывших кофе и очень много правды",story:"Мы почти поссорились, а потом решили говорить честно до конца. Было страшно. К ночи стало легче, чем за предыдущие полгода.",gift:"Ты научила меня, что конфликт — не конец, а ремонт. Мы стали прочнее ровно после этого вечера.",thought:"Иногда любовь — это не молчать, когда очень хочется."},{id:"t3",title:"Твоя рука в коридоре",date:"день, который мы не выбирали",x:1884,y:1e3,magnitude:1,photo:"https://images.pexels.com/photos/5071291/pexels-photo-5071291.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",caption:"Мы просто держались и ждали",story:"Белый коридор, неудобные стулья и часы, которые шли слишком медленно. Ты не отпускала мою руку ни на минуту и говорила глупости, чтобы мне было не так страшно.",gift:"Ты — мой человек в чрезвычайной ситуации. Я знаю, кому позвоню первым. Это огромная роскошь.",thought:"Настоящее видно не на празднике, а в коридоре."}]},{id:"futurum",name:"Впереди",latin:"Futurum",subtitle:"Звёзды, которые ещё не случились. Но свет от них уже идёт",color:"#8affd1",lines:[["f1","f2"],["f2","f3"],["f3","f1"]],stars:[{id:"f1",title:"Дом, который мы придумали",date:"когда-нибудь скоро",x:1120,y:600,magnitude:2,photo:"https://images.pexels.com/photos/35342046/pexels-photo-35342046.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",caption:"Большой стол, тёплый свет и много места для людей",story:"У нас уже есть планировка в голове: окно на восток, полка для твоих книг, кот, которого мы ещё не завели, и вечно занятый чайник.",gift:"Ты научила меня мечтать конкретно. Раньше будущее было туманом, теперь у него есть адрес.",thought:"Я хочу состариться именно на этой кухне."},{id:"f2",title:"Список стран",date:"висит на холодильнике",x:1272,y:662,magnitude:3,photo:"https://images.pexels.com/photos/4190562/pexels-photo-4190562.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",caption:"Половина пунктов — твои, и это к лучшему",story:"Двадцать три строчки, четыре вычеркнуты. Мы дописываем новые быстрее, чем успеваем ездить, и это, кажется, и есть план на жизнь.",gift:"С тобой у меня появилось будущее время. Я снова строю планы дальше, чем на месяц.",thought:"Обещаю: вычеркнем все. Даже самый нелогичный пункт."},{id:"f3",title:"Мы через десять лет",date:"уже видно отсюда",x:1184,y:792,magnitude:1,photo:"https://images.pexels.com/photos/34351940/pexels-photo-34351940.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",caption:"Тот же смех, только морщинок больше",story:"Я вижу нас очень отчётливо: ты всё так же смеёшься над своим
